name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Format check
        run: npm run fmt --workspaces --if-present -- --check

      - name: Lint
        run: |
          npm run lint
          npm run lint:qualification

      - name: Build
        run: npm run build

      - name: Compiled runtime acceptance
        # These process-lifecycle checks use Unix SIGTERM semantics.
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: npm run test:runtime

      - name: Test
        run: npm run test:qualification && npm test && npm run typecheck && npm run test:journey && npm run openapi:check && npm run test:browser

      - name: Installed provider contracts
        run: npm run test:provider-installed && npm run test:provider-types

      - name: Signed provider browser journeys
        run: npm run test:provider-browser
